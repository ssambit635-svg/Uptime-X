name: UptimeX checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uptimex
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: uptimex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uptimex -d uptimex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://uptimex:test-only-password@127.0.0.1:5432/uptimex_test' || 'sqlite:///:memory:' }}
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://uptimex:test-only-password@127.0.0.1:5432/uptimex_test' || 'sqlite:///./.local/ci.db' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: ruff check backend tests && ruff format --check backend tests
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: Verify migration upgrade, drift, and rollback
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  browser:
    name: Browser journeys
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install --require-hashes -r backend/requirements-dev.lock
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: frontend/test-results/
          retention-days: 5

  containers:
    name: Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: curl --fail --retry 3 http://127.0.0.1:8080/api/v1/health && curl --fail http://127.0.0.1:8080/
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down --volumes
        if: always()
